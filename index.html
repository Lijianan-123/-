<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>视频解析并下载（Demo）</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body{font-family:Arial,Helvetica,sans-serif;padding:24px;max-width:900px;margin:auto}
    input,button,select{padding:8px;font-size:16px}
    .row{margin-bottom:12px}
    ul{padding-left:20px}
  </style>
</head>
<body>
  <h1>视频解析并下载（Demo）</h1>
  <div class="row">
    <input id="url" type="text" placeholder="粘贴视频链接（YouTube / B站 / 抖音 等）" style="width:70%" />
    <button id="parseBtn">解析</button>
  </div>
  <div id="info"></div>
  <script>
    async function parseUrl(){
      const url = document.getElementById('url').value.trim();
      if(!url){ alert('请输入视频链接'); return; }
      document.getElementById('info').textContent = '解析中...';
      try{
        const res = await fetch('/api/parse', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({url})
        });
        if(!res.ok){ throw new Error(await res.text()); }
        const data = await res.json();
        const title = data.title || '未知标题';
        const formats = data.formats || [];
        let html = `<p><strong>${title}</strong></p>`;
        if(formats.length){
          html += '<p>可选格式（示例展示前 6 项）：</p><ul>';
          formats.slice(0,6).forEach((f,i)=>{
            html += `<li>${f.format} - ${f.ext} - ${f.filesize ? (Math.round(f.filesize/1024)+' KB') : '未知'} - <button onclick="download(${i})">下载</button></li>`;
          });
          html += '</ul>';
        } else {
          html += `<p><button onclick="download(-1)">直接下载（默认）</button></p>`;
        }
        document.getElementById('info').innerHTML = html;
        window._lastParse = {url, formats};
      }catch(e){
        document.getElementById('info').textContent = '解析失败：' + e.message;
      }
    }
    async function download(formatIndex){
      const p = window._lastParse;
      if(!p){ alert('请先解析'); return; }
      const params = {url:p.url};
      if(formatIndex>=0){ params.format = p.formats[formatIndex].format_id || p.formats[formatIndex].format; }
      const q = new URLSearchParams(params).toString();
      // 导航到下载接口，后端以 attachment 返回
      window.location = '/api/download?' + q;
    }
    document.getElementById('parseBtn').addEventListener('click',parseUrl);
  </script>
</body>
</html>
